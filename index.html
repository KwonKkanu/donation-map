<!DOCTYPE html> <!--HTML5로 작성되었다는 선언 브라우저가 최신방식으로 파일을 읽게끔 함-->
<html lang="ko"> <!--웹페이지 주언어가 한국어라는 선언-->
<head>  <!-- 문서의 메타데이터(데이터에 대한 데이터)를 담는 단락-->
    <meta charset="UTF-8">  <!--이 문서의 문자를 UTF-8 방식으로 읽으라는 표시-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 기기의 폭에 맞춰 보여줘라 라는 코드 
    width=device-width = 기기의 가로길이에 맞춤, initial-scale=1.0 = 처음 접속 시 비율을 1:1로 맞춤-->
    <title>Donation Map (기부지도)</title>
    <!--브라우저 위에 뜨는 사이트 문구-->
    <script src="https://cdn.tailwindcss.com"></script> </head>
    <!--"인터넷 어딘가(CDN)에 저장된 Tailwind CSS라는 디자인 도구를 가져와라"는 명령어입니다.-->
<body class="bg-gray-50 text-gray-900">
    <nav class="p-6 bg-white shadow-sm flex justify-between items-center"> 
        <a href="/" class="hover:opacity-80 transition-opacity">
            <h1 class="text-2xl font-bold text-blue-600">Donation Map</h1>
        </a>
        <!--<a>태그는 Anchor의 약자로 하이퍼링크를 만드는 역할을 함.
            href에는 어느 페이지로 가야하는지에 대한 주소가.
            class에는 당연히 어떻게 꾸며질것인가에 대한 내용이.-->
        <a href="main_service.html" 
            class="inline-block px-6 py-2 bg-blue-600 text-white font-bold rounded-2xl shadow-lg hover:bg-blue-700 transition-all duration-300 text-sm">
            기부 지도 보러가기
        </a>
    </nav>
    <!--<nav> (Navigation): 화면 맨 위에 고정된 긴 막대기 (로고가 있는 곳)-->
    
    <main class="max-w-4xl mx-auto mt-20 text-center px-4">
        <!--<main> (Main Content): 페이지의 진짜 내용이 들어가는 중앙 영역-->
        <h2 class="text-4xl font-extrabold mb-4">세상의 모든 기부를 한눈에.</h2>
        <p class="text-xl text-gray-600 mb-8">신뢰할 수 있는 기부 플랫폼을 큐레이션하여 연결해 드립니다.</p>
        
        <div class="bg-white p-10 rounded-3xl shadow-2xl border border-gray-100 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-400 to-teal-400"></div>
            
            <h3 class="text-2xl font-extrabold text-gray-800 mb-4">당신과 세상을 잇는 따뜻한 징검다리</h3>
            <p class="text-gray-600 text-lg leading-relaxed mb-8">
                기부처를 일일이 찾아다니지 마세요. 카카오 같이가치, 해피빈, 굿네이버스 등 검증된 대형 플랫폼들의 기부 캠페인들을 한곳에 매일 업데이트하여 모아둡니다. <br>
                마음에 드는 캠페인을 찾으셨다면, <b>해당 원본 플랫폼으로 안전하게 연결(링크)</b>되어 바로 기부하실 수 있습니다.
            </p>
            
            <div class="mt-6 flex justify-center gap-3 flex-wrap">
                <span class="px-5 py-2 bg-blue-50/50 border border-blue-100 text-blue-700 rounded-full text-sm font-bold shadow-sm">#투명한_징검다리</span>
                <span class="px-5 py-2 bg-green-50/50 border border-green-100 text-green-700 rounded-full text-sm font-bold shadow-sm">#실시간_큐레이션</span>
                <span class="px-5 py-2 bg-purple-50/50 border border-purple-100 text-purple-700 rounded-full text-sm font-bold shadow-sm">#원클릭_안전이동</span>
            </div>
            
            <div class="mt-12 mb-4">
                <a href="main_service.html" class="inline-flex items-center gap-3 px-8 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold rounded-2xl shadow-xl hover:shadow-2xl transition-all hover:-translate-y-1 transform text-lg">
                    오늘의 기부 리스트 살펴보기
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
